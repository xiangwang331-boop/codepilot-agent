[project]
name = "codepilot"
version = "0.1.0"
description = "CodePilot — LangGraph 驱动的 Multi-Agent 软件工程运行时（P0：单 Agent + ReAct + Tools + Workspace）"
requires-python = ">=3.13"
dependencies = [
    "langgraph>=0.2.60",
    "langchain-core>=0.3.30",
    "langchain-openai>=0.2.10",
    "pydantic>=2.7",
    "langgraph-checkpoint-sqlite>=3.1.1",
    # P6: PostgreSQL 持久化（checkpoint + 事件）。psycopg 必须带 [binary]——
    # 纯 Python 版仍需要 host 上的 libpq，Windows 上没装 PG 客户端会 ImportError。
    "langgraph-checkpoint-postgres>=3.1.2",
    "psycopg[binary]>=3.2",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
    "psycopg-pool>=3.3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
