<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodePilot 会话控制台</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #262b36; --fg: #d7dce5;
    --dim: #7b8494; --accent: #4c8dff; --ok: #3fb950; --warn: #d29922; --err: #f85149;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.6 ui-monospace,
    "Cascadia Mono", Consolas, monospace;
  }
  header {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  h1 { font-size: 15px; margin: 0 12px 0 0; font-weight: 600; }
  main { display: grid; grid-template-columns: 1fr 380px; gap: 16px; padding: 16px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
  section > h2 {
    margin: 0; padding: 10px 14px; font-size: 13px; color: var(--dim);
    border-bottom: 1px solid var(--line); font-weight: 600;
  }
  button {
    font: inherit; padding: 6px 14px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--line); background: #21252e; color: var(--fg);
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.ok { background: var(--ok); border-color: var(--ok); color: #06210c; }
  button.no { background: var(--err); border-color: var(--err); color: #2a0605; }
  input {
    font: inherit; flex: 1; min-width: 0; padding: 7px 10px; border-radius: 6px;
    border: 1px solid var(--line); background: #0e1014; color: var(--fg);
  }
  .row { display: flex; gap: 8px; padding: 12px 14px; align-items: center; }
  .pill {
    padding: 2px 9px; border-radius: 999px; font-size: 12px;
    border: 1px solid var(--line); color: var(--dim);
  }
  .pill.idle { color: var(--dim); }
  .pill.running { color: var(--accent); border-color: var(--accent); }
  .pill.awaiting_approval { color: var(--warn); border-color: var(--warn); }
  .pill.closed { color: var(--err); border-color: var(--err); }
  .pill.live { color: var(--ok); border-color: var(--ok); }
  .pill.dead { color: var(--err); border-color: var(--err); }
  .id { color: var(--dim); font-size: 12px; user-select: all; }

  #events { height: calc(100vh - 230px); min-height: 260px; overflow-y: auto; padding: 6px 0; }
  .ev { padding: 3px 14px; border-left: 3px solid transparent; white-space: pre-wrap; word-break: break-word; }
  .ev .who { color: var(--accent); }
  .ev .ts { color: #4a5261; font-size: 12px; margin-right: 6px; }
  .ev .msg { color: var(--fg); }
  .ev .meta { color: var(--dim); font-size: 12px; }
  .ev.t-AgentStarted, .ev.t-AgentCompleted { border-left-color: var(--ok); }
  .ev.t-AgentFailed, .ev.t-Error { border-left-color: var(--err); }
  .ev.t-ToolCallStarted, .ev.t-ToolCallFinished { border-left-color: #3a4150; }
  .ev.t-Condense, .ev.t-TokenUsage { border-left-color: var(--warn); }
  .ev.detail { color: var(--dim); font-size: 12px; padding-left: 30px; }

  #approval { margin: 0 14px 14px; padding: 12px; border: 1px solid var(--warn); border-radius: 6px; }
  #approval h3 { margin: 0 0 8px; font-size: 13px; color: var(--warn); }
  #approval .task { color: var(--dim); font-size: 12px; margin-bottom: 10px; white-space: pre-wrap; }
  #approval .actions { display: flex; gap: 8px; }
  #approval[hidden] { display: none; }
  #log { padding: 0 14px 12px; color: var(--dim); font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>CodePilot</h1>
  <button id="new" class="primary">新建会话</button>
  <span class="pill" id="session-pill">无会话</span>
  <span class="id" id="session-id"></span>
  <span style="flex:1"></span>
  <span class="pill" id="ws-pill">未连接</span>
</header>

<main>
  <section>
    <h2>事件流</h2>
    <div id="events"></div>
  </section>

  <section>
    <h2>操作</h2>
    <div class="row">
      <input id="task" placeholder="描述开发需求，回车发送" autocomplete="off">
      <button id="send">发送</button>
    </div>
    <div id="approval" hidden>
      <h3>需要批准</h3>
      <div class="task" id="approval-task"></div>
      <div class="actions">
        <button class="ok" id="approve">批准</button>
        <button class="no" id="reject">拒绝</button>
      </div>
    </div>
    <div id="log"></div>
  </section>
</main>

<script>
"use strict";

const $ = (id) => document.getElementById(id);
const eventsEl = $("events");

let threadId = null;
let socket = null;
let lastSeq = -1;      // 已收到的最大事件序号；重连时用 ?since=lastSeq+1 补发
let retry = 0;         // 重连退避次数
let reconnectTimer = null;

// ---------------------------------------------------------------- 小工具

function log(text, isError) {
  const el = document.createElement("div");
  el.textContent = text;
  if (isError) el.style.color = "var(--err)";
  $("log").prepend(el);
}

function setSession(status, id) {
  const pill = $("session-pill");
  pill.textContent = status === null ? "无会话" : status;
  pill.className = "pill" + (status ? " " + status : "");
  $("session-id").textContent = id || "";
}

function setWs(live) {
  const pill = $("ws-pill");
  pill.textContent = live ? "已连接" : "未连接";
  pill.className = "pill " + (live ? "live" : "dead");
}

async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: body ? { "Content-Type": "application/json" } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  if (res.status === 204) return null;
  const text = await res.text();
  const data = text ? JSON.parse(text) : null;
  if (!res.ok) {
    // FastAPI 的错误体：HTTPException → {detail}，校验失败 → {detail:[...]}
    const detail = data && data.detail;
    const message = typeof detail === "string" ? detail
      : detail && detail.message ? detail.message
      : JSON.stringify(detail);
    throw new Error(`${res.status} ${message}`);
  }
  return data;
}

// ---------------------------------------------------------------- 事件渲染

function renderEvent(envelope) {
  const e = envelope.event || {};
  const el = document.createElement("div");
  el.className = "ev t-" + e.type;

  const ts = document.createElement("span");
  ts.className = "ts";
  ts.textContent = (e.timestamp || "").slice(11, 19);
  el.appendChild(ts);

  const who = document.createElement("span");
  who.className = "who";
  who.textContent = "[" + (e.agent || "-") + "] ";
  el.appendChild(who);

  const msg = document.createElement("span");
  msg.className = "msg";
  // AGENT_STARTED / AGENT_COMPLETED 没有 message，用类型补上，免得出现空行
  msg.textContent = e.message || e.type;
  el.appendChild(msg);

  eventsEl.appendChild(el);

  // detail 单独起一行（压缩摘要、token 消耗这类情报都在里面）
  const detail = e.detail;
  if (detail && Object.keys(detail).length) {
    const d = document.createElement("div");
    d.className = "ev detail";
    d.textContent = JSON.stringify(detail);
    eventsEl.appendChild(d);
  }
  eventsEl.scrollTop = eventsEl.scrollHeight;
}

function applyStatus(envelope) {
  setSession(envelope.status, envelope.thread_id);
  const approval = envelope.approval || [];
  const box = $("approval");
  if (envelope.status === "awaiting_approval" && approval.length) {
    $("approval-task").textContent = approval
      .map((p) => p.question || `${p.specialist}: ${p.task}`).join("\n\n");
    box.hidden = false;
  } else {
    box.hidden = true;
  }
  refreshButtons(envelope.status);
}

function refreshButtons(status) {
  const busy = status === "running" || status === "awaiting_approval";
  $("send").disabled = !threadId || busy;
  $("task").disabled = !threadId || busy;
}

// ---------------------------------------------------------------- WebSocket

function connect() {
  if (!threadId) return;
  const url = new URL(`/sessions/${threadId}/ws`, location.origin);
  url.protocol = url.protocol.replace("http", "ws");
  if (lastSeq >= 0) url.searchParams.set("since", String(lastSeq + 1));

  socket = new WebSocket(url);

  socket.onopen = () => { retry = 0; setWs(true); };

  socket.onmessage = (ev) => {
    const envelope = JSON.parse(ev.data);
    if (envelope.kind === "status") applyStatus(envelope);
    else if (envelope.kind === "event") {
      // 断线重连时回填段可能与已渲染的重叠，靠 seq 去重
      if (typeof envelope.seq === "number") {
        if (envelope.seq <= lastSeq) return;
        lastSeq = envelope.seq;
      }
      renderEvent(envelope);
    } else if (envelope.kind === "error") {
      log("服务端: " + envelope.message, true);
      setWs(false);
    }
  };

  socket.onclose = (ev) => {
    setWs(false);
    // 4404 = 会话不存在（服务重启后内存目录就没了）——重连没有意义，别刷屏。
    if (ev.code === 4404 || ev.code === 4503) { log("服务端关闭连接: " + ev.code, true); return; }
    scheduleReconnect();
  };

  socket.onerror = () => setWs(false);
}

function scheduleReconnect() {
  if (reconnectTimer) return;
  // 1s 起、指数退避到 10s 封顶。服务重启期间会连续失败，退避免得打满日志。
  const delay = Math.min(1000 * 2 ** retry, 10000);
  retry += 1;
  reconnectTimer = setTimeout(() => { reconnectTimer = null; connect(); }, delay);
}

// ---------------------------------------------------------------- 动作

$("new").onclick = async () => {
  try {
    const data = await api("POST", "/sessions", {});
    threadId = data.thread_id;
    lastSeq = -1;
    eventsEl.innerHTML = "";
    $("log").innerHTML = "";
    setSession(data.status, data.thread_id);
    refreshButtons(data.status);
    log("已创建会话 " + data.thread_id);
  } catch (e) {
    log("创建会话失败: " + e.message, true);
    return;
  }
  if (socket) { socket.onclose = null; socket.close(); }   // 换会话时别触发旧连接的重连
  if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
  connect();
};

async function sendTask() {
  const task = $("task").value.trim();
  if (!threadId || !task) return;
  $("task").value = "";
  try {
    await api("POST", `/sessions/${threadId}/messages`, { task });
    log("已提交: " + task);
  } catch (e) {
    // 409 会话忙 —— 服务端按状态字段挡，不靠线程存活判断
    log("提交失败: " + e.message, true);
    $("task").value = task;
  }
  refreshButtons("running");   // 乐观禁用，真正的状态以 WS 推来的为准
}

async function answer(approved) {
  $("approval").hidden = true;
  try {
    await api("POST", `/sessions/${threadId}/approval`, { approved });
    log(approved ? "已批准" : "已拒绝");
  } catch (e) {
    log("审批失败: " + e.message, true);
  }
}

$("send").onclick = sendTask;
$("task").onkeydown = (e) => { if (e.key === "Enter") sendTask(); };
$("approve").onclick = () => answer(true);
$("reject").onclick = () => answer(false);

// 开场自动建一个会话，省掉一次点击
$("new").click();
</script>
</body>
</html>
